<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Dikshant Chitara - Full Stack Software Engineer</title>
  <desc id="desc">Animated dark technology-themed profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".52" stop-color="#172554"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <circle cx="170" cy="80" r="95" fill="#22d3ee" opacity=".16" filter="url(#blur)">
    <animate attributeName="cx" values="170;280;170" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="230" r="120" fill="#818cf8" opacity=".18" filter="url(#blur)">
    <animate attributeName="cy" values="230;150;230" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#67e8f9" opacity=".35">
    <path d="M0 235 C180 180 260 290 430 220 S760 150 1200 230"/>
    <path d="M0 250 C180 195 260 305 430 235 S760 165 1200 245" opacity=".45"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="600" y="115" fill="#fff" font-size="52" font-weight="800" letter-spacing="5">DIKSHANT CHITARA</text>
    <text x="600" y="158" fill="#a5f3fc" font-size="21" font-weight="700" letter-spacing="2">FULL STACK SOFTWARE ENGINEER</text>
    <text x="600" y="198" fill="#e0f2fe" font-size="17">MERN  |  AI ENGINEERING  |  DISTRIBUTED SYSTEMS</text>
  </g>
  <g fill="url(#glow)">
    <circle cx="86" cy="56" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="68" r="4"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="82" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
